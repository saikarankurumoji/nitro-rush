const SMOOTH=1200;
function buildCenterline(ctrl,scale,N){
 const P=ctrl.map(([x,z])=>[x*scale,z*scale]),n=P.length,dense=[];
 for(let i=0;i<n;i++){const [p0,p1,p2,p3]=[P[(i+n-1)%n],P[i],P[(i+1)%n],P[(i+2)%n]];

 {let A=Float64Array.from(pts,p=>p.x),C=Float64Array.from(pts,p=>p.z),B=new Float64Array(N),D=new Float64Array(N);

 for(let i=0;i<N;i++){const a=pts[(i+N-1)%N],b=pts[(i+1)%N],l=Math.hypot(b.x-a.x,b.z-a.z),tx=(b.x-a.x)/l,tz=(b.z-a.z)/l;tangents.push({x:tx,z:tz});normals.push({x:tz,z:-tx});}

const cloudTex=(()=>{const c=document.createElement('canvas');c.width=256;c.height=128;const g=c.getContext('2d');for(let i=0;i<22;i++){const x=40+Math.random()*176,y=44+Math.random()*40,r=18+Math.random()*30,gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,'rgba(255,255,255,.55)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,256,128);}return new THREE.CanvasTexture(c);})();
const roadTex=()=>{const c=document.createElement('canvas');c.width=c.height=512;const g=c.getContext('2d');g.fillStyle='#b9b9b9';g.fillRect(0,0,512,512);
 for(let i=0;i<9000;i++){const l=150+Math.random()*80|0;g.fillStyle=`rgba(${l},${l},${l},.55)`;const r=.6+Math.random()*1.8;g.fillRect(Math.random()*512,Math.random()*512,r,r);}
 for(let i=0;i<7;i++){g.strokeStyle='rgba(30,30,32,.35)';g.lineWidth=.8+Math.random();g.beginPath();let x=Math.random()*512,y=Math.random()*512;g.moveTo(x,y);for(let k=0;k<9;k++){x+=(Math.random()-.5)*60;y+=(Math.random()-.4)*50;g.lineTo(x,y);}g.stroke();}
 for(let i=0;i<5;i++){const x=100+Math.random()*312,y=100+Math.random()*312,r=g.createRadialGradient(x,y,2,x,y,40+Math.random()*50);r.addColorStop(0,'rgba(60,60,64,.35)');r.addColorStop(1,'rgba(60,60,64,0)');g.fillStyle=r;g.fillRect(0,0,512,512);}
 const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=8;return t;};
function facade(mat,night){mat.onBeforeCompile=sh=>{
 sh.vertexShader='varying vec3 vWP;\n'+sh.vertexShader.replace('#include <begin_vertex>','#include <begin_vertex>\nvec4 wp4=vec4(transformed,1.);\n#ifdef USE_INSTANCING\nwp4=instanceMatrix*wp4;\n#endif\nvWP=(modelMatrix*wp4).xyz;');
 const win=`vec3 fn=normalize(cross(dFdx(vWP),dFdy(vWP)));float side=1.-step(.5,abs(fn.y));float u=abs(fn.x)>abs(fn.z)?vWP.z:vWP.x;vec2 g=vec2(u/3.6,vWP.y/3.4);vec2 cell=floor(g),f=fract(g);
float win=step(.18,f.x)*step(f.x,.82)*step(.22,f.y)*step(f.y,.78)*side*step(1.2,vWP.y);float h=fract(sin(dot(cell,vec2(12.9898,78.233))+floor(vWP.x*.02+vWP.z*.02))*43758.5453);`;
 sh.fragmentShader='varying vec3 vWP;\n'+sh.fragmentShader.replace('#include <color_fragment>','#include <color_fragment>\n'+win+'\ndiffuseColor.rgb*=mix(1.,.82+.18*fract(vWP.y*.13),side);diffuseColor.rgb=mix(diffuseColor.rgb,vec3(.07,.12,.18)*(.6+.8*h),win*.85);')
  .replace('#include <emissivemap_fragment>','#include <emissivemap_fragment>\ntotalEmissiveRadiance+=vec3(1.,.82,.5)*win*step(.55,h)*'+(night?'1.5':'0.0')+';');};mat.needsUpdate=true;}
function upgradeWorld(c){const G=world,night=!!c.night,L=[];G.traverse(o=>L.push(o));
 if(roadMat){roadMat.map=roadTex();roadMat.needsUpdate=true;}
 const tint=c.tw===1?0xffb08a:c.tw===2?0x8a90d8:night?0x5a6590:0xffffff;
 L.forEach(o=>{if(!o.isInstancedMesh)return;const gt=o.geometry.type;
  if(gt==='BoxGeometry'&&o.castShadow&&o.material.isMeshLambertMaterial)facade(o.material,night);
  else if(gt==='SphereGeometry'&&o.geometry.parameters.radius===1&&o.material.isMeshBasicMaterial&&o.count===104){o.visible=false;
   for(let k=0;k<45;k++){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:cloudTex,color:tint,transparent:true,opacity:.85,depthWrite:false,fog:false})),a=Math.random()*6.283,R=500+Math.random()*1100,w=300+Math.random()*350;s.position.set(Math.cos(a)*R+150,260+Math.random()*180,Math.sin(a)*R+150);s.scale.set(w,w*.42,1);G.add(s);}}
  else if(gt==='ConeGeometry'&&o.geometry.parameters.radius===2.6){o.geometry=new THREE.ConeGeometry(3.4,4.6,10).translate(0,3.4,0);
   [[2.7,4.2,5.9],[1.9,3.8,8.3],[1.1,3.2,10.6]].forEach(([r,h,y])=>{const m=new THREE.InstancedMesh(new THREE.ConeGeometry(r,h,10).translate(0,y,0),o.material,o.count);m.instanceMatrix=o.instanceMatrix;if(o.instanceColor)m.instanceColor=o.instanceColor;m.castShadow=true;G.add(m);});}
  else if(gt==='DodecahedronGeometry'){const g=new THREE.IcosahedronGeometry(1,3),p=g.attributes.position,v=new THREE.Vector3();
   for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i);const n=Math.sin(v.x*5.1+1.3)*Math.cos(v.y*4.3)*Math.sin(v.z*5.7+.6),k=1+n*.22+Math.sin(v.x*13+v.z*11)*.05;p.setXYZ(i,v.x*k,v.y*k*.8,v.z*k);}
   g.computeVertexNormals();o.geometry=g;}});
 envBake();}
{const _bw2=buildWorld;buildWorld=function(c){window.__SM=c.sm||SMOOTH;_bw2(c);upgradeWorld(c);};}

const treadMat=(()=>{const c=document.createElement('canvas');c.width=128;c.height=32;const g=c.getContext('2d');g.fillStyle='#17171a';g.fillRect(0,0,128,32);g.fillStyle='#0a0a0c';for(let i=0;i<32;i++)g.fillRect(i*4,0,2,32);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return new THREE.MeshStandardMaterial({map:t,roughness:.9});})();
const chrome=new THREE.MeshStandardMaterial({color:0xdfe3ea,metalness:1,roughness:.18}),disc=new THREE.MeshStandardMaterial({color:0x8a8e95,metalness:1,roughness:.35});
{const _bc=buildCar;buildCar=function(spec,color,ghost){const o=_bc(spec,color,ghost),wr=o.wr;
 o.wheels.forEach(w=>{const sg=Math.sign(w.position.x)||1;w.material=treadMat;
  w.children.filter(ch=>ch.geometry&&ch.geometry.type==='BoxGeometry').forEach(sp=>{const s2=sp.clone();s2.rotation.x+=.6283;w.add(s2);});
  const add=(geo,m,x)=>{const q=new THREE.Mesh(geo,m);q.position.x=x;w.add(q);};
  add(new THREE.TorusGeometry(wr*.62,.03,8,28).rotateY(Math.PI/2),chrome,sg*.17);add(new THREE.CylinderGeometry(.07,.07,.05,12).rotateZ(Math.PI/2),chrome,sg*.19);
  add(new THREE.CylinderGeometry(wr*.55,wr*.55,.02,20).rotateZ(Math.PI/2),disc,sg*.205);
  for(const s of[-1,1])add(new THREE.TorusGeometry(wr-.03,.05,8,28).rotateY(Math.PI/2),treadMat,s*.15);});
 return o;};}

// ---------- REAR-VIEW MIRROR: show rivals behind (AI + online), hide the player's own smoke ----------
rearUpdate=function(){const el=$('rear'),p=physics,fx=Math.sin(p.heading),fz=Math.cos(p.heading),cand=[];let best=null;
 BOTS.forEach((b,i)=>cand.push({x:b.ph.x,z:b.ph.z,col:b.col,nm:'Rival '+(i+1)}));
 if(MP.room)for(const q of MP.room.peers()){const o=MP.cars[q.peer];if(q.isMe||!o)continue;cand.push({x:o.group.position.x,z:o.group.position.z,col:q.presence.col,nm:label(q)});}
 if(race&&race.state!=='idle')for(const c of cand){const dx=c.x-p.x,dz=c.z-p.z,d=Math.hypot(dx,dz);if(dx*fx+dz*fz<0&&d<(MP.rear?95:70)&&(!best||d<best.d))best={d,c};}
 MP.rear=!!best;const show=GF.mirror==='always'||(GF.mirror==='auto'&&best);el.hidden=!show||!race||race.state==='idle'||$('hud').hidden;
 if(!el.hidden){$('rearTag').textContent=best?'▼ '+best.c.nm+' · '+Math.round(best.d)+' m':'REAR VIEW';el.classList.toggle('warn',!!best&&best.d<25);const c=best&&best.c.col;el.style.borderColor=/^#[0-9a-f]{6}$/i.test(c)?c:'#fff';}};
{const _rr=rearRender;rearRender=function(){const sv=smoke.map(s=>s.visible);smoke.forEach(s=>s.visible=false);spM.visible=false;_rr();smoke.forEach((s,i)=>s.visible=sv[i]);spM.visible=true;};}

results=eval('('+sub(results,[[/\$\{bl\?`<small>Fastest lap[^`]*`:''\}/,'']])+')');
