const cloudTex=(()=>{const c=document.createElement('canvas');c.width=256;c.height=128;const g=c.getContext('2d');for(let i=0;i<22;i++){const x=40+Math.random()*176,y=44+Math.random()*40,r=18+Math.random()*30,gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,'rgba(255,255,255,.55)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,256,128);}return new THREE.CanvasTexture(c);})();

 for(let i=0;i<5;i++){const x=100+Math.random()*312,y=100+Math.random()*312,r=g.createRadialGradient(x,y,2,x,y,40+Math.random()*50);r.addColorStop(0,'rgba(60,60,64,.35)');r.addColorStop(1,'rgba(60,60,64,0)');g.fillStyle=r;g.fillRect(0,0,512,512);}

function facade(mat,night){mat.onBeforeCompile=sh=>{
 sh.vertexShader='varying vec3 vWP;\n'+sh.vertexShader.replace('#include <begin_vertex>','#include <begin_vertex>\nvec4 wp4=vec4(transformed,1.);\n#ifdef USE_INSTANCING\nwp4=instanceMatrix*wp4;\n#endif\nvWP=(modelMatrix*wp4).xyz;');
 const win=`vec3 fn=normalize(cross(dFdx(vWP),dFdy(vWP)));float side=1.-step(.5,abs(fn.y));float u=abs(fn.x)>abs(fn.z)?vWP.z:vWP.x;vec2 g=vec2(u/3.6,vWP.y/3.4);vec2 cell=floor(g),f=fract(g);
float win=step(.18,f.x)*step(f.x,.82)*step(.22,f.y)*step(f.y,.78)*side*step(1.2,vWP.y);float h=fract(sin(dot(cell,vec2(12.9898,78.233))+floor(vWP.x*.02+vWP.z*.02))*43758.5453);`;
