function buildCenterline(ctrl,scale,N){
 const P=ctrl.map(([x,z])=>[x*scale,z*scale]),n=P.length,dense=[];

  if(MP.host&&!q.isMe){const k=document.createElement('button');k.className='kick';k.textContent='KICK';k.onclick=e=>{e.stopPropagation();MP.room.kick(q.peer);};d.appendChild(k);}$('pl').appendChild(d);});
 if(MP.host)MAPS.forEach((m,i)=>{const d=document.createElement('div');d.className='opt'+(sel.map===i?' on':'');d.textContent=m.name;d.onclick=()=>{sel.map=i;MP.room.presence({map:i});lobby();};$('mpm2').appendChild(d);});

 }else RL.innerHTML=`<div class="hint">Laps ${R.laps} · Collisions ${R.cc?'on':'off'} · Nitro ${['normal','off','infinite'][R.nt]||'normal'} · ${R.same?'Host car for all':'Free car choice'}${R.lock?' · Room locked':''}</div>`;
 const add=(l,f,alt)=>{const b=document.createElement('button');b.className='go'+(alt?' alt':'');b.textContent=l;b.onclick=f;$('bt').appendChild(b);};

function rules(){const h=MP.room&&MP.room.peers().find(q=>q.presence.host),P=h?h.presence:{};return{laps:(P.laps|0)||3,cc:P.cc===0?0:1,nt:P.nt|0,same:P.same|0,lock:P.lock|0};}
function toLobby(){MP.fin=null;if(race)race.state='idle';MP.room.presence({r:0,fin:null,pg:0});clearCars();$('count').textContent='';lobby();}
function mpRanks(){const val=q=>q.isMe?(MP.fin?1e3-MP.fin:MP.pg):(q.presence.fin?1e3-q.presence.fin:q.presence.pg||0),L=MP.room.peers().filter(q=>q.isMe||q.presence.r).sort((a,b)=>val(b)-val(a)),o={_n:L.length,me:1};L.forEach((q,i)=>{o[q.peer]=i+1;if(q.isMe)o.me=i+1;});return o;}
function mpTags(){const hud=$('hud'),R=mpRanks(),W=innerWidth,H=innerHeight,v=new THREE.Vector3(),live=new Set();camera.updateMatrixWorld();
 for(const q of MP.room.peers()){const o=MP.cars[q.peer];if(q.isMe||!o)continue;live.add(q.peer);
  let el=MP.tags[q.peer];if(!el){el=MP.tags[q.peer]=document.createElement('div');el.className='tag';hud.appendChild(el);}
  const txt='P'+(R[q.peer]||'-')+' · '+label(q);if(el.textContent!==txt)el.textContent=txt;const col=q.presence.col;el.style.borderColor=/^#[0-9a-f]{6}$/i.test(col)?col:'#fff';
  v.set(o.group.position.x,2.7,o.group.position.z).project(camera);const d=camera.position.distanceTo(o.group.position);
  if(v.z>1||Math.abs(v.x)>1.15||Math.abs(v.y)>1.15||d>400){el.style.display='none';continue;}
  el.style.display='block';el.style.opacity=d>180?.65:1;el.style.transform=`translate(${((v.x*.5+.5)*W).toFixed(1)}px,${((-v.y*.5+.5)*H).toFixed(1)}px) translate(-50%,-100%)`;}
 for(const id in MP.tags)if(!live.has(id)){MP.tags[id].remove();delete MP.tags[id];}}
function viewSig(){if(!MP.room)return'';const ps=sortedPeers();
 if(MP.view==='lobby')return'L'+sel.map+JSON.stringify(rules())+ps.map(q=>[q.peer,label(q),q.presence.car,q.presence.col,q.presence.host].join()).join('|');
 if(MP.view==='results'){const v=q=>q.isMe?(MP.fin?1e3-MP.fin:MP.pg):(q.presence.fin?1e3-q.presence.fin:q.presence.pg||0);
  return'R'+ps.filter(q=>q.presence.r||q.presence.fin).sort((a,b)=>v(b)-v(a)).map(q=>[q.peer,label(q),q.isMe?MP.fin:q.presence.fin].join()).join('|');}
 return'';}
function mpTick(dt){if(!MP.room)return;const p=physics,r=race,N=track.N,last=r.cps[(r.expected-1)%r.K],f=((idx-last+N)%N)/(N/r.K);
 MP.pg=(r.lap-1)*r.K+(r.expected-1)+(f>1.3?0:Math.min(f,1));MP.t+=dt;
 if(MP.t>.05){MP.t=0;MP.room.presence({x:+p.x.toFixed(2),z:+p.z.toFixed(2),h:+p.heading.toFixed(3),vx:+p.vx.toFixed(1),vz:+p.vz.toFixed(1),r:1,pg:+MP.pg.toFixed(2),b:p.boosting?1:0});}
 const rl=rules();for(const o of Object.values(MP.cars)){if(!rl.cc)break;const dx=o.group.position.x-p.x,dz=o.group.position.z-p.z,d=Math.hypot(dx,dz);if(d<2.5&&d>.01&&r.state==='racing')p.bump(dx/d,dz/d,(2.5-d)*.5);}
 const R=mpRanks();$('pos').textContent='P'+R.me+'/'+R._n;}
function mpFrame(dt){if(!MP.room)return;const seen=new Set(),k=1-Math.exp(-14*dt);
 for(const q of MP.room.peers()){const P=q.presence;if(q.isMe||!P.r||!Number.isFinite(P.x)||!Number.isFinite(P.z))continue;seen.add(q.peer);
  const key=(P.car|0)+String(P.col);let o=MP.cars[q.peer];
  if(!o||o.key!==key){if(o)scene.remove(o.group);const sp=CARS[P.car|0]||CARS[0];o=MP.cars[q.peer]=buildCar(sp,/^#[0-9a-f]{6}$/i.test(P.col)?P.col:sp.color,1);o.key=key;o.group.position.set(P.x,0,P.z);o.group.rotation.y=P.h||0;}
  const el=Math.min(.15,(Date.now()-q.updatedAt)/1000),g=o.group;
  g.position.x+=(P.x+(P.vx||0)*el-g.position.x)*k;g.position.z+=(P.z+(P.vz||0)*el-g.position.z)*k;
  let d=(P.h||0)-g.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));g.rotation.y+=d*k;o.flames.forEach(f=>f.visible=!!P.b);}
 for(const id in MP.cars)if(!seen.has(id)){scene.remove(MP.cars[id].group);delete MP.cars[id];}mpTags();}

 const v=q=>q.isMe?(MP.fin?1e3-MP.fin:MP.pg):(q.presence.fin?1e3-q.presence.fin:q.presence.pg||0);ps.sort((a,b)=>v(b)-v(a));

 ps.forEach((q,i)=>{const d=document.createElement('div'),f=q.isMe?MP.fin:q.presence.fin;d.className='opt'+(q.isMe?' on':'');d.innerHTML=`${i+1}. ${esc(label(q))}${q.isMe?' (you)':''}<small>${f?fmt(f):'racing…'}</small>`;$('pl').appendChild(d);});
